[project]
name = "owasp-toronto-meetup-scraper"
version = "0.1.0"
description = "Scrapes past events from OWASP Toronto's Meetup page"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.0",
    "html2text>=2020.1.16",
    "python-dateutil>=2.8.2",
    "playwright>=1.40.0",
]
authors = [{ name = "Ads Dawson", email = "ads.dawson@owasp.org" }]
